[workspace]
resolver = "2"
members = [
    "shared",
    "backend",
    "frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PyraOcean Engineering"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"


